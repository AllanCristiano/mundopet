# MundoPet - stack completa
#   Subir:            docker compose up -d --build
#   Escalar a API:    docker compose up -d --scale api=6     (minimo 1, MAXIMO 6 - ver RULES.md)
#                     ou ./scripts/scale.ps1 6  |  ./scripts/scale.sh 6
#   Teste de DoS:     docker compose --profile dos run --rm k6
#   Gerar APK:        docker compose --profile mobile run --rm flutter-apk

name: mundopet

x-api-env: &api-env
  DB_HOST: postgres
  DB_PORT: 5432
  DB_NAME: ${POSTGRES_DB:-mundopet}
  DB_USER: ${POSTGRES_USER:-mundopet}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-mundopet}
  DB_POOL_MIN: ${DB_POOL_MIN:-5}
  DB_POOL_MAX: ${DB_POOL_MAX:-20}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-mundopet}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-mundopet123}
  MINIO_BUCKET: ${MINIO_BUCKET:-mundopet}
  RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-50}
  QUEUE_CONCURRENCY: ${QUEUE_CONCURRENCY:-16}
  # Taxa de entrega por distancia (coordenadas da loja + preco por km)
  STORE_LAT: ${STORE_LAT:--23.5505}
  STORE_LNG: ${STORE_LNG:--46.6333}
  DELIVERY_PRICE_PER_KM: ${DELIVERY_PRICE_PER_KM:-2.00}
  DELIVERY_MAX_KM: ${DELIVERY_MAX_KM:-15}
  DELIVERY_ROAD_FACTOR: ${DELIVERY_ROAD_FACTOR:-1.3}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mundopet}
      POSTGRES_USER: ${POSTGRES_USER:-mundopet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mundopet}
    # 6 replicas x 20 conexoes (pool R2DBC) = 120  <  200
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1G }
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    # noeviction: mensagens da fila NUNCA podem ser descartadas por falta de memoria
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 384M }
    restart: unless-stopped

  minio:
    # Imagens oficiais minio/minio deixaram de ser publicadas; pgsty/minio e um build comunitario compativel
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mundopet}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-mundopet123}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9101}:9001"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
    restart: unless-stopped

  api:
    build: ./backend
    image: mundopet-api:latest
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    # Sem container_name e sem porta publicada: necessario para rodar varias replicas.
    # O trafego entra so pelo nginx.
    deploy:
      replicas: ${API_REPLICAS:-2}
      resources:
        # Escala vertical por replica (a JVM usa 75% da memoria do limite)
        limits: { cpus: "${API_CPUS:-1.0}", memory: "${API_MEMORY:-768M}" }
        reservations: { cpus: "0.25", memory: 384M }
      restart_policy:
        condition: on-failure
    stop_grace_period: 30s

  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    image: mundopet-nginx:latest
    ports:
      - "${HTTP_PORT:-8088}:80"
    volumes:
      # APK gerado pelo perfil "mobile" fica disponivel em /download/mundopet.apk sem rebuild
      - ./dist:/usr/share/nginx/downloads:ro
    depends_on:
      api: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 256M }
    restart: unless-stopped

  # ---------------- Perfis opcionais ----------------
  k6:
    image: grafana/k6:1.3.0
    profiles: ["dos"]
    environment:
      TARGET: http://nginx
      DURATION: ${DOS_DURATION:-30s}
      ATTACK_RPS: ${DOS_ATTACK_RPS:-500}
    volumes:
      - ./tests/dos:/scripts:ro
    command: ["run", "/scripts/dos.js"]
    depends_on:
      nginx: { condition: service_healthy }

  flutter-apk:
    image: ghcr.io/cirruslabs/flutter:3.41.7
    profiles: ["mobile"]
    working_dir: /app
    volumes:
      - ./mobile:/app
      - ./dist:/dist
      - flutter-pub-cache:/root/.pub-cache
      - flutter-gradle:/root/.gradle
    command:
      - sh
      - -c
      - >-
        flutter pub get &&
        flutter test &&
        flutter build apk --release --dart-define=API_URL=${MOBILE_API_URL:-http://10.0.2.2:8088} &&
        cp build/app/outputs/flutter-apk/app-release.apk /dist/mundopet.apk &&
        echo "APK gerado em dist/mundopet.apk"

volumes:
  pgdata:
  redisdata:
  miniodata:
  flutter-pub-cache:
  flutter-gradle:
