spring:
  application:
    name: mundopet-api
  main:
    banner-mode: off

  # ---------- Postgres ASSINCRONO (R2DBC) com pool de multiplas conexoes ----------
  # Orcamento: max-size (20) x 6 replicas = 120 conexoes  <  max_connections do Postgres (200)
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mundopet}
    username: ${DB_USER:mundopet}
    password: ${DB_PASSWORD:mundopet}
    pool:
      enabled: true
      initial-size: ${DB_POOL_MIN:5}
      max-size: ${DB_POOL_MAX:20}
      max-idle-time: 30m
      max-acquire-time: 5s
      max-create-connection-time: 5s
      validation-query: SELECT 1

  # Flyway usa JDBC so na subida (lock consultivo no Postgres => seguro com varias replicas)
  flyway:
    # db/seed = dados de EXEMPLO do catalogo. Em producao: FLYWAY_LOCATIONS=classpath:db/migration
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/seed}
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mundopet}
    user: ${DB_USER:mundopet}
    password: ${DB_PASSWORD:mundopet}

  # ---------- Redis (Lettuce: conexao multiplexada e nao bloqueante) ----------
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      connect-timeout: 2s

  webflux:
    multipart:
      max-disk-usage-per-part: 5MB
      max-parts: 8
  codec:
    max-in-memory-size: 1MB

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

mundopet:
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests-per-window: ${RATE_LIMIT_REQUESTS:50}
    window-seconds: ${RATE_LIMIT_WINDOW:1}
  queue:
    stream: jobs
    dead-letter-stream: jobs:dlq
    group: mundopet-api
    concurrency: ${QUEUE_CONCURRENCY:16}
    max-attempts: 3
    job-timeout: 30s
    status-ttl: 1d
    worker-enabled: ${QUEUE_WORKER_ENABLED:true}
  address:
    # Consulta de CEP: tenta na ordem; o resultado fica em cache no Redis
    viacep-url: ${VIACEP_URL:https://viacep.com.br/ws}
    brasilapi-url: ${BRASILAPI_URL:https://brasilapi.com.br/api/cep/v1}
    timeout: 3s
    cache-ttl: 30d
  admin:
    # Login da gestao do site e da area da clinica. Sem senha e sem demo = area desligada.
    username: ${ADMIN_USER:admin}
    password: ${ADMIN_PASSWORD:}
    # true = login e senha em branco tambem entram (SO PARA DEMONSTRACAO)
    demo: ${ADMIN_DEMO:false}
    session-ttl: 8h
    # Opcional: token fixo para scripts/automacao (minimo 24 caracteres)
    token: ${ADMIN_TOKEN:}
  delivery:
    # Taxa de entrega = km ate a loja x preco por km (km = linha reta x road-factor, arredondado p/ cima em 0,1)
    store-lat: ${STORE_LAT:-23.5505}
    store-lng: ${STORE_LNG:-46.6333}
    price-per-km: ${DELIVERY_PRICE_PER_KM:2.00}
    max-km: ${DELIVERY_MAX_KM:15}
    road-factor: ${DELIVERY_ROAD_FACTOR:1.3}
    # Coordenadas do CEP: tenta na ordem; resultado em cache no Redis
    awesomeapi-url: ${AWESOMEAPI_CEP_URL:https://cep.awesomeapi.com.br/json}
    brasilapi-url: ${BRASILAPI_CEP_V2_URL:https://brasilapi.com.br/api/cep/v2}
    timeout: 3s
    cache-ttl: 30d
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:mundopet}
    secret-key: ${MINIO_SECRET_KEY:mundopet123}
    bucket: ${MINIO_BUCKET:mundopet}
