spring:
  application:
    name: mundopet-api
  main:
    banner-mode: off

  # ---------- Postgres ASSINCRONO (R2DBC) com pool de multiplas conexoes ----------
  # Orcamento: max-size (20) x 6 replicas = 120 conexoes  <  max_connections do Postgres (200)
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mundopet}
    username: ${DB_USER:mundopet}
    password: ${DB_PASSWORD:mundopet}
    pool:
      enabled: true
      initial-size: ${DB_POOL_MIN:5}
      max-size: ${DB_POOL_MAX:20}
      max-idle-time: 30m
      max-acquire-time: 5s
      max-create-connection-time: 5s
      validation-query: SELECT 1

  # Flyway usa JDBC so na subida (lock consultivo no Postgres => seguro com varias replicas)
  flyway:
    # db/seed = dados de EXEMPLO do catalogo. Em producao: FLYWAY_LOCATIONS=classpath:db/migration
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/seed}
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mundopet}
    user: ${DB_USER:mundopet}
    password: ${DB_PASSWORD:mundopet}

  # ---------- Redis (Lettuce: conexao multiplexada e nao bloqueante) ----------
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      connect-timeout: 2s

  webflux:
    multipart:
      max-disk-usage-per-part: 5MB
      max-parts: 5
  codec:
    max-in-memory-size: 1MB

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

mundopet:
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests-per-window: ${RATE_LIMIT_REQUESTS:50}
    window-seconds: ${RATE_LIMIT_WINDOW:1}
  queue:
    stream: jobs
    dead-letter-stream: jobs:dlq
    group: mundopet-api
    concurrency: ${QUEUE_CONCURRENCY:16}
    max-attempts: 3
    job-timeout: 30s
    status-ttl: 1d
    worker-enabled: ${QUEUE_WORKER_ENABLED:true}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:mundopet}
    secret-key: ${MINIO_SECRET_KEY:mundopet123}
    bucket: ${MINIO_BUCKET:mundopet}
