worker_processes auto;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile      on;
    tcp_nopush    on;

    # DNS interno do Docker: reresolve "api" a cada 10s, entao novas replicas (ate 6) entram no balanceamento sozinhas
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---------------- Protecao contra negacao de servico (1a barreira) ----------------
    limit_req_zone  $binary_remote_addr zone=api_rl:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # Slowloris / conexoes penduradas
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          10s;
    keepalive_timeout     15s;
    keepalive_requests    1000;
    client_max_body_size  5m;
    client_header_buffer_size   1k;
    large_client_header_buffers 4 8k;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Cache das fotos do Espaco Beleza: a maioria das visitas nem chega na API/MinIO.
    # Curto (10 min) para que uma foto apagada pela clinica saia do ar rapido.
    proxy_cache_path /var/cache/nginx/beauty levels=1:2 keys_zone=beauty:10m max_size=512m inactive=1d use_temp_path=off;

    upstream api {
        zone api 64k;
        least_conn;
        server api:8080 resolve max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 80;
        root /usr/share/nginx/html;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location /api/ {
            limit_req  zone=api_rl burst=60 nodelay;
            limit_conn perip 50;

            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            # Sobrescreve o que o cliente mandar: a API confia neste header para o rate limit dela
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 3s;
            proxy_read_timeout    30s;
            proxy_send_timeout    30s;
            # Se uma replica cair, tenta a proxima (somente metodos idempotentes por padrao)
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 3;
        }

        # Fotos do Espaco Beleza (so GET; com cache no nginx)
        location ~ "^/api/beauty/photos/[0-9a-fA-F-]{36}/(thumb|full)$" {
            limit_except GET { deny all; }
            limit_req  zone=api_rl burst=120 nodelay;
            limit_conn perip 50;

            proxy_cache beauty;
            proxy_cache_valid 200 10m;
            proxy_cache_valid 404 1m;
            proxy_cache_lock on;
            proxy_cache_use_stale error timeout updating http_502 http_503;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Content-Type-Options nosniff always;

            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_connect_timeout 3s;
            proxy_read_timeout    30s;
        }

        # Health publico (sem rate limit) usado pelo teste de DoS para medir disponibilidade
        location = /health {
            proxy_pass http://api/actuator/health/readiness;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /actuator/ {
            return 404;
        }

        # APK do app (pasta ./dist montada no container; gerada por: docker compose --profile mobile run --rm flutter-apk)
        # Se o arquivo nao existir: 404 (a landing mostra "em breve"), nunca o index.html da SPA.
        location /download/ {
            alias /usr/share/nginx/downloads/;
            types { application/vnd.android.package-archive apk; }
            default_type application/octet-stream;
            add_header Content-Disposition "attachment" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control "no-cache" always;
            # Download grande e alvo facil de DoS: poucas conexoes simultaneas por IP e banda limitada
            limit_conn perip 3;
            limit_rate_after 5m;
            limit_rate 2m;
            try_files $uri =404;
        }

        location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
